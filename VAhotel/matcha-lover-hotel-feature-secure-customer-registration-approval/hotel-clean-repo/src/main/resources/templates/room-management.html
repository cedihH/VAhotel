<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room management · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap manager-page"><div th:replace="~{fragments :: alerts}"></div><div class="manager-layout"><section class="manager-content"><h1 class="page-title">Room management</h1><a class="button" href="/manager/rooms/new">Add room</a><div class="table-wrap" style="margin-top:28px"><table><thead><tr><th>Room</th><th>Type</th><th>Description</th><th>Capacity</th><th>Rate / night</th><th>Availability</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="room : ${rooms}"><td th:text="${room.roomNumber}">101</td><td th:text="${room.type}">Standard</td><td th:text="${room.description}">Description</td><td th:text="${room.capacity} + ' guests'">2 guests</td><td th:text="'₱' + ${#numbers.formatDecimal(room.nightlyRate,1,'COMMA',0,'POINT')}">₱1,800</td><td th:text="${room.available ? 'Available' : 'Unavailable'}">Available</td><td th:text="${room.active ? 'Active' : 'Inactive'}">Active</td><td><a th:href="@{'/manager/rooms/' + ${room.id} + '/edit'}">Edit</a> <form th:if="${room.active}" th:action="@{'/manager/rooms/' + ${room.id} + '/deactivate'}" method="post" th:attr="data-confirm=${roomReservationWarnings[room.id]}"><button class="button tiny" type="submit">Deactivate</button></form><form th:unless="${room.active}" th:action="@{'/manager/rooms/' + ${room.id} + '/reactivate'}" method="post" data-confirm="Reactivate this room for bookings?"><button class="button tiny" type="submit">Reactivate</button></form></td></tr></tbody></table></div></section></div></main><script src="/js/app.js"></script></body></html>
